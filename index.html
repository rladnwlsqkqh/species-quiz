<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3d2b">
<title>생물 동정 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f1e8;
    --ink: #1d2a21;
    --muted: #5d6b60;
    --card: #ffffff;
    --line: #d9d5c5;
    --brand: #1f3d2b;
    --brand-ink: #ffffff;
    --ok: #2e8b4f;
    --ok-bg: #e2f4e7;
    --bad: #c23b33;
    --bad-bg: #fbe4e2;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  .screen { display: none; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
  .screen.active { display: flex; flex-direction: column; }

  /* ---------- 메인 ---------- */
  #home { align-items: center; justify-content: center; gap: 48px; }
  .title { text-align: center; }
  .title h1 { margin: 0; font-size: clamp(40px, 6vw, 72px); font-weight: 900; letter-spacing: -0.02em; color: var(--brand); }
  .title p { margin: 12px 0 0; font-size: clamp(18px, 2.2vw, 26px); color: var(--muted); }
  .cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; width: min(1000px, 100%); }
  .cat {
    background: var(--card); border: 3px solid var(--line); border-radius: var(--radius);
    padding: 40px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    box-shadow: 0 6px 0 var(--line); transition: transform .08s, box-shadow .08s;
  }
  .cat:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
  .cat .emoji { font-size: clamp(64px, 9vw, 110px); line-height: 1; }
  .cat .name { font-size: clamp(28px, 3.6vw, 44px); font-weight: 900; }
  .cat .sub { font-size: 18px; color: var(--muted); }
  .cat:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- 문제 ---------- */
  #quiz { gap: 20px; }
  .quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .chip { background: var(--brand); color: var(--brand-ink); padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: 22px; }
  .q-text { font-size: clamp(24px, 3vw, 34px); font-weight: 900; margin: 0; }
  .quiz-body { flex: 1; display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; min-height: 0; }
  .photo {
    background: #000; border-radius: var(--radius); overflow: hidden;
    display: flex; align-items: center; justify-content: center; min-height: 0;
  }
  .photo img { width: 100%; height: 100%; max-height: calc(100dvh - 180px); object-fit: contain; display: block; }
  .side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .choices { display: grid; grid-template-columns: 1fr; gap: 16px; flex: 1; }
  .choice {
    background: var(--card); border: 3px solid var(--line); border-radius: 18px;
    padding: 18px 22px; font-size: clamp(24px, 2.8vw, 34px); font-weight: 700; text-align: left;
    display: flex; align-items: center; gap: 18px; min-height: 84px;
    box-shadow: 0 5px 0 var(--line); transition: transform .08s, box-shadow .08s;
  }
  .choice .num {
    flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--bg);
    display: grid; place-items: center; font-size: 24px; font-weight: 900; color: var(--muted);
  }
  .choice:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .choice:disabled { cursor: default; }
  .choice.correct { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 5px 0 var(--ok); }
  .choice.correct .num { background: var(--ok); color: #fff; }
  .choice.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 5px 0 var(--bad); }
  .choice.wrong .num { background: var(--bad); color: #fff; }
  .choice.dim { opacity: .45; }

  .result { display: none; flex-direction: column; gap: 14px; }
  .result.show { display: flex; animation: pop .25s ease-out; }
  .verdict { font-size: clamp(30px, 3.8vw, 44px); font-weight: 900; text-align: center; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .answer-line { text-align: center; font-size: 22px; color: var(--muted); }
  .answer-line b { color: var(--ink); }
  .home-btn {
    background: var(--brand); color: var(--brand-ink); border-radius: 18px; padding: 22px;
    font-size: clamp(24px, 2.8vw, 32px); font-weight: 900; box-shadow: 0 5px 0 #0f2017;
  }
  .home-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0f2017; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 세로 모드 / 좁은 화면 */
  @media (orientation: portrait), (max-width: 820px) {
    .quiz-body { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .photo img { max-height: 48dvh; }
    .choices { grid-template-columns: 1fr 1fr; }
    .choice { min-height: 96px; }
  }
  @media (max-width: 600px) {
    .screen { padding-left: 16px; padding-right: 16px; }
    .cats { grid-template-columns: 1fr; gap: 16px; }
    .cat { flex-direction: row; padding: 20px; justify-content: center; }
    .choices { grid-template-columns: 1fr; }
    .choice { min-height: 68px; }
  }
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="title">
    <h1>생물 동정 퀴즈</h1>
    <p>사진을 보고 이름을 맞혀 보세요! 분류군을 고르세요.</p>
  </div>
  <div class="cats" id="cats"></div>
</section>

<section id="quiz" class="screen">
  <div class="quiz-head">
    <p class="q-text">이 생물의 이름은?</p>
    <span class="chip" id="cat-chip"></span>
  </div>
  <div class="quiz-body">
    <div class="photo"><img id="q-img" alt="문제 사진"></div>
    <div class="side">
      <div class="choices" id="choices"></div>
      <div class="result" id="result">
        <div class="verdict" id="verdict"></div>
        <div class="answer-line">정답: <b id="answer-name"></b></div>
        <button class="home-btn" id="home-btn">메인으로 돌아가기</button>
      </div>
    </div>
  </div>
</section>

<script src="data.js"></script>
<script>
(function () {
  const DATA = window.QUIZ_DATA;
  const ORDER = ["birds", "fish", "insects"];
  const $ = (id) => document.getElementById(id);

  // ---------- 저장소 (실패해도 동작하도록) ----------
  const mem = {};
  function load(key) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch (e) { return mem[key] || null; }
  }
  function save(key, val) {
    mem[key] = val;
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- 연속 중복 방지 출제 ----------
  // 분류군마다 "섞은 문제 묶음(bag)"을 두고 하나씩 꺼냄.
  // 묶음을 다 쓰면 새로 섞되, 직전 문제가 맨 앞에 오지 않게 함.
  // → 같은 문제가 연속으로 나오지 않고, 10문제가 고르게 돌아감.
  function nextQuestion(catKey) {
    const qs = DATA[catKey].questions;
    const ids = qs.map(q => q.id);
    const key = "quiz-state-" + catKey;
    let st = load(key) || { bag: [], last: null };
    st.bag = (st.bag || []).filter(id => ids.includes(id));

    if (st.bag.length === 0) {
      st.bag = shuffle(ids);
      if (st.bag.length > 1 && st.bag[0] === st.last) {
        const j = 1 + Math.floor(Math.random() * (st.bag.length - 1));
        [st.bag[0], st.bag[j]] = [st.bag[j], st.bag[0]];
      }
    }
    const id = st.bag.shift();
    st.last = id;
    save(key, st);
    return qs.find(q => q.id === id);
  }

  // ---------- 화면 ----------
  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
    window.scrollTo(0, 0);
  }

  function renderHome() {
    const wrap = $("cats");
    wrap.innerHTML = "";
    ORDER.forEach(k => {
      const c = DATA[k];
      const n = c.questions.length;
      const b = document.createElement("button");
      b.className = "cat";
      b.disabled = n === 0;
      b.innerHTML = `<span class="emoji">${c.emoji}</span><span class="name">${c.name}</span>` +
        `<span class="sub">${n ? n + "문제" : "준비 중"}</span>`;
      b.addEventListener("click", () => startQuiz(k));
      wrap.appendChild(b);
    });
  }

  let locked = false;

  function startQuiz(catKey) {
    const cat = DATA[catKey];
    const q = nextQuestion(catKey);
    if (!q) return;
    locked = false;

    $("cat-chip").textContent = cat.emoji + " " + cat.name;
    $("q-img").src = q.image;
    $("result").classList.remove("show");

    const box = $("choices");
    box.innerHTML = "";
    shuffle(q.choices).forEach((name, i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.dataset.name = name;
      b.innerHTML = `<span class="num">${i + 1}</span><span></span>`;
      b.lastChild.textContent = name;
      b.addEventListener("click", () => pick(b, q));
      box.appendChild(b);
    });
    show("quiz");
  }

  function pick(btn, q) {
    if (locked) return;
    locked = true;
    const ok = btn.dataset.name === q.answer;
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
      if (b.dataset.name === q.answer) b.classList.add("correct");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    const v = $("verdict");
    v.textContent = ok ? "⭕ 정답입니다!" : "❌ 아쉬워요!";
    v.className = "verdict " + (ok ? "ok" : "bad");
    $("answer-name").textContent = q.answer;
    $("result").classList.add("show");
  }

  $("home-btn").addEventListener("click", () => show("home"));

  // 이미지 미리 불러오기
  ORDER.forEach(k => DATA[k].questions.forEach(q => { const i = new Image(); i.src = q.image; }));

  renderHome();
})();
</script>
</body>
</html>
